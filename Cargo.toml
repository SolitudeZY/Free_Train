[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/application",
    "crates/domain",
    "crates/image-pipeline",
    "crates/job-engine",
    "crates/media",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.97"

[workspace.dependencies]
application = { path = "crates/application" }
domain = { path = "crates/domain" }
image-pipeline = { path = "crates/image-pipeline" }
job-engine = { path = "crates/job-engine" }
media = { path = "crates/media" }
storage = { path = "crates/storage" }

image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
chrono = { version = "0.4", features = ["serde"] }
exif = { package = "kamadak-exif", version = "0.6" }
fs2 = "0.4"
hex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustdct = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
